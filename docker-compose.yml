services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: rag-tutor-surrealdb
    command: start --log info --user root --pass root memory
    ports:
      - "8001:8000"
    environment:
      SURREAL_USER: root
      SURREAL_PASS: root
    restart: unless-stopped

